<!DOCTYPE html>
<!-- A&L Cakes - Login (formulário simples com validação JS) -->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - A&L Cakes</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="pagina-login">

  <!-- Header será carregado dinamicamente via header.js -->

  <main>
    <div class="form-container login-container">
      <div class="login-brand">
        <img src="../assets/images/alcakes_logo.png" alt="A&L Cakes" class="login-logo" />
      </div>

      <form id="form-login" novalidate>
        <div class="campo">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="seuemail@email.com" required />
        </div>
        <div class="campo">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" placeholder="••••••" required />
        </div>
        <button type="button" class="btn" id="btn_login">Entrar</button>
      </form>

      <p class="link-extra">Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
    </div>
  </main>

  <footer class="rodape">

    <div class="copyright">
      © <span data-current-year></span> A&L Cakes. Todos os direitos reservados.
    </div>
  </footer>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="../assets/js/controller.js"></script>
  <script src="../assets/js/header.js"></script>
  <script src="../assets/js/login.js"></script>


</body>
</html>
