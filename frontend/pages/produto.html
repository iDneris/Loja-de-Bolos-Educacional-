<!DOCTYPE html>
<!-- A&L Cakes - Página individual de produto (recebe ?id=... via URL) -->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Produto - A&L Cakes</title>
  <meta name="description" content="Detalhes do produto e compra direta pelo WhatsApp." />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
  <!-- Header será carregado dinamicamente via header.js -->
<!-- ===== DETALHE DO PRODUTO (renderizado via JS) ===== -->
  <main class="container">
    <a href="cardapio.html" style="display:inline-block; margin-bottom:1.5rem; color:var(--rosa-escuro);">&larr; Voltar ao cardápio</a>
    <div class="produto-detalhe" id="detalhe-produto"></div>
  </main>

  <!-- ===== RODAPÉ ===== -->
  <!-- Footer será carregado dinamicamente via footer.js -->

    <!-- MODAL CARRINHO -->
    <div class="overlay-carrinho" id="overlay-carrinho">

      <div class="modal-carrinho">

        <div class="topo-carrinho">

          <h2>Seu Carrinho</h2>

          <button class="fechar-carrinho"
            id="fechar-carrinho">

            &times;

          </button>

        </div>

        <div class="carrinho-itens">

        </div>

        <div class="rodape-carrinho">

          <div class="total-carrinho">

            Total:
            <span>R$ 89,90</span>

          </div>

          <button class="btn-finalizar" id="btn-finalizar">

            Finalizar Compra

          </button>

        </div>

      </div>

    </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="../assets/js/controller.js"></script>
  <script src="../assets/js/header.js"></script>
  <script src="../assets/js/footer.js"></script>
  <script src="../assets/js/produtos.js"></script>
  <script src="../assets/js/carrinho.js"></script>
  <script src="../assets/js/script.js"></script>

  <script>

    /* =========================================================
      MODAL CARRINHO
    ========================================================= */

    const abrirCarrinho =
      document.getElementById("abrir-carrinho");

    const fecharCarrinho =
      document.getElementById("fechar-carrinho");

    const overlayCarrinho =
      document.getElementById("overlay-carrinho");

    /* Abrir modal */
    abrirCarrinho?.addEventListener("click", () => {

      overlayCarrinho.classList.add("ativo");

    });

    /* Fechar modal */
    fecharCarrinho?.addEventListener("click", () => {

      overlayCarrinho.classList.remove("ativo");

    });

    /* Fechar clicando fora */
    overlayCarrinho?.addEventListener("click", (e) => {

      if (e.target === overlayCarrinho) {

        overlayCarrinho.classList.remove("ativo");

      }

    });

    </script>
</body>
</html>
