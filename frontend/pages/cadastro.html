<!DOCTYPE html>
<!-- A&L Cakes - Cadastro de Cliente (formulário com validação JS) -->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro - A&L Cakes</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

  <!-- Header será carregado dinamicamente via header.js -->

  <main>
    <div class="form-container">
      <h2>Crie sua conta</h2>
      <p class="subtitulo">É rápido e fácil, comece a saborear ✨</p>

      <form id="form-cadastro" novalidate>
        <div class="campo">
          <label for="nome">Nome completo</label>
          <input type="text" id="nome" name="nome" placeholder="Seu nome" required />
        </div>
        <div class="campo">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required />
        </div>
        <div class="campo">
          <label for="telefone">Telefone</label>
          <input type="tel" id="telefone" name="telefone" placeholder="(XX) XXXXX-XXXX" required />
        </div>
        <div class="campo">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" placeholder="Mínimo 6 caracteres" required />
        </div>
        <button type="submit" class="btn" id="btn_cadastrar_cliente">Cadastrar</button>
      </form>

      <p class="link-extra">Já tem conta? <a href="login.html">Entrar</a></p>
    </div>
  </main>

  <footer class="rodape">

    <div class="copyright">
      © <span data-current-year></span> A&L Cakes. Todos os direitos reservados.
    </div>
  </footer>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="../assets/js/controller.js"></script>
  <script src="../assets/js/header.js"></script>
  <script src="../assets/js/CadastroCliente.js"></script>
</body>
</html>
