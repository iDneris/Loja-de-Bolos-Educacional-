<!DOCTYPE html>
<!-- A&L Cakes - Meus Pedidos -->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Meus Pedidos - A&L Cakes</title>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../assets/css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>

  <!-- Header será carregado dinamicamente via header.js -->

  <main>

    <div class="form-container pedidos-container">

      <h2>Meus Pedidos</h2>

      <p class="subtitulo">
        Histórico de compras realizadas no site
      </p>

      <div id="lista-pedidos">
        <p style="text-align:center;color:var(--texto-claro);">Carregando pedidos...</p>
      </div>

    </div>

  </main>

  <!-- RODAPÉ -->
  <!-- Footer será carregado dinamicamente via footer.js -->

  <!-- MODAL CARRINHO -->
  <div class="overlay-carrinho" id="overlay-carrinho">

    <div class="modal-carrinho">

      <div class="topo-carrinho">

        <h2>Seu Carrinho</h2>

        <button class="fechar-carrinho" id="fechar-carrinho">
          &times;
        </button>

      </div>

      <div class="carrinho-itens">

      </div>

      <div class="rodape-carrinho">

        <div class="total-carrinho">
          Total: <span>R$ 89,90</span>
        </div>

        <button class="btn-finalizar" id="btn-finalizar">
          Finalizar Compra
        </button>

      </div>

    </div>

  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="../assets/js/controller.js"></script>
  <script src="../assets/js/header.js"></script>
  <script src="../assets/js/footer.js"></script>
  <script>
    $(document).ready(function() {
      carregarPedidos();
    });

    async function carregarPedidos() {
      try {
        const pedidos = await apiCall('/pedidos', 'GET', null, true);
        // console.log('Pedidos recebidos:', pedidos);
        renderizarPedidos(pedidos);
      } catch (error) {
        console.error('Erro ao carregar pedidos:', error);
        $('#lista-pedidos').html('<p style="text-align:center;color:var(--texto-claro);">Faça login para ver seus pedidos.</p>');
      }
    }

    function formatarStatusPedido(status) {
      const labels = {
        pendente: 'Pendente',
        confirmado: 'Confirmado',
        em_preparo: 'Em preparo',
        pronto_retirada: 'Pronto para retirada',
        saiu_entrega: 'Saiu para entrega',
        entregue: 'Entregue',
        cancelado: 'Cancelado',
        enviado: 'Saiu para entrega'
      };
      return labels[status] || 'Pendente';
    }

    function renderizarPedidos(pedidos) {
      if (!pedidos || pedidos.length === 0) {
        $('#lista-pedidos').html('<p style="text-align:center;color:var(--texto-claro);">Nenhum pedido encontrado.</p>');
        return;
      }

      $('#lista-pedidos').html(pedidos.map(p => {
        let data = 'Data não disponível';
        try {
          if (p.data) {
            const dataObj = new Date(p.data);
            if (!isNaN(dataObj.getTime())) {
              data = dataObj.toLocaleDateString('pt-BR');
            }
          }
        } catch (e) {
          console.error('Erro ao formatar data:', e);
        }
        
        // Usa numero_pedido se disponível, senão usa ID truncado
        const numeroPedido = p.numero_pedido || p.id.substring(0, 8);
        
        const statusClass = (p.status || 'pendente').replace(/_/g, '-');
        const statusTexto = formatarStatusPedido(p.status);

        const itensHtml = p.itens ? p.itens.map(item => `
          <div class="pedido-produto">
            <div class="pedido-info">
              <h4>${item.nomeBolo || item.nome}</h4>
              <p>${item.quantidade} unidade(s)</p>
              <span>R$ ${Number(item.precoUnitario || item.preco).toFixed(2).replace('.', ',')}</span>
            </div>
          </div>
        `).join('') : '';

        return `
          <div class="pedido-card" data-id="${p.id}">
            <div class="pedido-topo">
              <div>
                <h3>Pedido #${numeroPedido}</h3>
                <p>${data}</p>
                <p>Status: <strong class="status-pedido ${statusClass}">${statusTexto}</strong></p>
              </div>
              ${p.status === 'pendente' ? `<button class="btn-excluir-pedido" data-id="${p.id}" title="Cancelar pedido" style="border:none;background:transparent;color:#d32f2f;font-size:13px;cursor:pointer;padding:5px;">Cancelar pedido</button>` : ''}
            </div>
            ${itensHtml}
          </div>
        `;
      }).join(''));
    }

    $(document).on('click', '.btn-excluir-pedido', async function() {
      const id = $(this).data('id');
      const result = await Swal.fire({
        title: 'Cancelar pedido?',
        text: 'O pedido será marcado como cancelado e a loja será avisada.',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonText: 'Sim, cancelar',
        cancelButtonText: 'Cancelar'
      });

      if (result.isConfirmed) {
        try {
          // console.log('Cancelando pedido:', id);
          await apiCall(`/pedidos/${id}`, 'DELETE', null, true);
          // console.log('Pedido cancelado, recarregando...');
          await Swal.fire('Cancelado!', 'Pedido cancelado com sucesso.', 'success');
          carregarPedidos();
        } catch (error) {
          // console.error('Erro ao excluir:', error);
          Swal.fire('Erro!', 'Não foi possível cancelar o pedido.', 'error');
        }
      }
    });
  </script>

</body>
</html>
