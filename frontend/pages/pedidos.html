<!DOCTYPE html>
<!-- A&L Cakes - Meus Pedidos -->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Meus Pedidos - A&L Cakes</title>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../assets/css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>

  <main>

    <div class="form-container pedidos-container">

      <h2>Meus Pedidos</h2>

      <p class="subtitulo">
        Historico de compras realizadas no site
      </p>

      <div id="lista-pedidos">
        <p style="text-align:center;color:var(--texto-claro);">Carregando pedidos...</p>
      </div>

    </div>

  </main>

  <!-- RODAPÉ -->
  <footer class="rodape">

    <div class="copyright">
      © <span data-current-year></span> A&L Cakes. Todos os direitos reservados.
    </div>

  </footer>

  <!-- MODAL CARRINHO -->
  <div class="overlay-carrinho" id="overlay-carrinho">

    <div class="modal-carrinho">

      <div class="topo-carrinho">

        <h2>Seu Carrinho</h2>

        <button class="fechar-carrinho" id="fechar-carrinho">
          &times;
        </button>

      </div>

      <div class="carrinho-itens">

        <div class="item-carrinho">

          <img src="../assets/images/BoloRedVelvet.jpg" alt="">

          <div class="info-item">
            <h3>Bolo Red Velvet</h3>
            <p>R$ 89,90</p>
          </div>

          <button class="remover-item">
            Remover
          </button>

        </div>

      </div>

      <div class="rodape-carrinho">

        <div class="total-carrinho">
          Total: <span>R$ 89,90</span>
        </div>

        <button class="btn-finalizar" id="btn-finalizar">
          Finalizar Compra
        </button>

      </div>

    </div>

  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="../assets/js/controller.js"></script>
  <script src="../assets/js/header.js"></script>
  <script>
    $(document).ready(function() {
      carregarPedidos();
    });

    async function carregarPedidos() {
      try {
        const pedidos = await apiCall('/pedidos', 'GET', null, true);
        renderizarPedidos(pedidos);
      } catch (error) {
        $('#lista-pedidos').html('<p style="text-align:center;color:var(--texto-claro);">Facaa login para ver seus pedidos.</p>');
      }
    }

    function renderizarPedidos(pedidos) {
      if (!pedidos || pedidos.length === 0) {
        $('#lista-pedidos').html('<p style="text-align:center;color:var(--texto-claro);">Nenhum pedido encontrado.</p>');
        return;
      }

      $('#lista-pedidos').html(pedidos.map(p => {
        const data = new Date(p.criado_em).toLocaleDateString('pt-BR');
        const statusClass = p.status === 'concluido' ? 'concluido' : 'pendente';
        const statusTexto = p.status.charAt(0).toUpperCase() + p.status.slice(1);

        const itensHtml = p.itens ? p.itens.map(item => `
          <div class="pedido-produto">
            <img src="${item.imagem_url || '../assets/images/BoloRedVelvet.jpg'}" alt="">
            <div class="pedido-info">
              <h4>${item.nome}</h4>
              <p>${item.quantidade} unidade(s)</p>
              <span>R$ ${Number(item.preco).toFixed(2).replace('.', ',')}</span>
            </div>
          </div>
        `).join('') : '';

        return `
          <div class="pedido-card">
            <div class="pedido-topo">
              <div>
                <h3>Pedido #${p.id.substring(0, 8)}</h3>
                <p>${data}</p>
              </div>
              <span class="status-pedido ${statusClass}">${statusTexto}</span>
            </div>
            ${itensHtml}
          </div>
        `;
      }).join(''));
    }
  </script>

</body>
</html>
