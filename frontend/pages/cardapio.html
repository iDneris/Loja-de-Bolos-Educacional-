<!DOCTYPE html>
<!-- A&L Cakes - Cardápio: lista todos os produtos -->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cardápio - A&L Cakes</title>
  <meta name="description" content="Conheça nosso cardápio completo de bolos, tortas, macarons, brigadeiros e doces artesanais." />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

  <!-- Header será carregado dinamicamente via header.js -->

  <!-- ===== CARDÁPIO ===== -->
  <main class="container">
    <h1 class="titulo-secao">Nosso Cardápio</h1>
    <p class="subtitulo-secao">Escolha seu próximo doce favorito</p>

    <!-- Grade de produtos (renderizada via JS) -->
    <div class="produtos-grid" id="grid-produtos" style="display:none;"></div>

    <!-- Skeleton Loading -->
    <div class="skeleton-grid" id="skeleton-grid">
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
    </div>
  </main>

  <!-- ===== RODAPÉ ===== -->
  <!-- Footer será carregado dinamicamente via footer.js -->


  <!-- MODAL CARRINHO -->
   
    <div class="overlay-carrinho" id="overlay-carrinho">

      <div class="modal-carrinho">

        <div class="topo-carrinho">

          <h2>Seu Carrinho</h2>

          <button class="fechar-carrinho" id="fechar-carrinho">
            &times;
          </button>

        </div>

        <div class="carrinho-itens">
          <p style="text-align:center;color:var(--texto-claro);">Carrinho vazio</p>
        </div>

        <div class="rodape-carrinho">

          <div class="total-carrinho">
            Total: <span>R$ 0,00</span>
          </div>

          <button class="btn-finalizar" id="btn-finalizar">
            Finalizar Compra
          </button>

        </div>

      </div>

    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../assets/js/controller.js"></script>
    <script src="../assets/js/header.js"></script>
    <script src="../assets/js/footer.js"></script>
    <script src="../assets/js/produtos.js"></script>
    <script src="../assets/js/carrinho.js"></script>
    <script src="../assets/js/script.js"></script>
</body>
</html>
